<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | WanderVerse</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow login-card">
                    <div class="card-body p-4">

                        <h3 class="text-center mb-2">Create an Account</h3>

                        <p class="text-center text-muted mb-4">
                            Join WanderVerse and start exploring the world!
                        </p>

                        <form>

                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control mb-3"
                                id="name" name="name"
                                placeholder="Enter your full name" required>

                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control mb-3"
                                id="email" name="email"
                                placeholder="Enter your email" required>

                            <label for="mobile" class="form-label">Mobile Number</label>
                            <input type="tel" class="form-control mb-3"
                                id="mobile" name="mobile"
                                placeholder="Enter your mobile number" required>

                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control mb-3"
                                id="password" name="password"
                                placeholder="Create a password" required>

                            <label for="confirmPassword" class="form-label">
                                Confirm Password
                            </label>
                            <input type="password" class="form-control mb-3"
                                id="confirmPassword" name="confirmPassword"
                                placeholder="Confirm your password" required>

                            <div class="form-check mb-3">
                                <input type="checkbox" class="form-check-input"
                                    id="terms" required>
                                <label class="form-check-label" for="terms">
                                    I agree to the Terms and Conditions
                                </label>
                            </div>

                            <button type="submit" class="btn login-btn w-100">
                                Register
                            </button>

                        </form>

                        <p class="text-center mt-4 mb-0">
                            Already have an account?
                            <a href="login.html" class="register-link">Login</a>
                        </p>

                    </div>
                </div>
                <a href="index.html" class="home-btn">Back to Home</a>

            </div>
        </div>
    </div>

</body>
</html>
